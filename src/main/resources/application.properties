spring.application.name=Claude-Agent-Demo

# --- AWS / Bedrock (credentials come from the default AWS chain: AWS_PROFILE, env vars or IAM role) ---
app.aws.region=${AWS_REGION:us-east-1}
spring.ai.bedrock.aws.region=${app.aws.region}

# --- Claude on Bedrock (Anthropic Java SDK, bedrock-runtime endpoint) ---
# Cross-region inference profile ID. Haiku 4.5 is the lowest-cost Claude model this account can use;
# switch to us.anthropic.claude-haiku-5-5 (cheaper) once its quota is above 0.
app.claude.model=us.anthropic.claude-haiku-4-5-20251001-v1:0
app.claude.max-tokens=16000
# low | medium | high | xhigh | max; leave empty for models without effort support (Haiku 4.5)
app.claude.effort=

# --- Embeddings: Amazon Titan Text Embeddings V2 (1024 dims) ---
spring.ai.model.embedding=bedrock-titan
spring.ai.model.chat=none
spring.ai.bedrock.titan.embedding.model=amazon.titan-embed-text-v2:0
spring.ai.bedrock.titan.embedding.input-type=text

# --- PostgreSQL + pgvector (Spring Boot Docker Compose starts compose.yaml in dev) ---
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=1024
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE

# --- Ingestion / retrieval ---
app.ingestion.chunk-size-tokens=800
# Tokens each chunk repeats from the end of the previous chunk on the same page (must be < chunk size)
app.ingestion.chunk-overlap-tokens=120
app.retrieval.top-k=6
app.retrieval.similarity-threshold=0.3

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
